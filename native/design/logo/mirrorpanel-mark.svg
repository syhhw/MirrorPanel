<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- MirrorPanel mark: an M whose right half is the glass reflection of the left,
       split by a seam of light, standing on a reflective floor. Master for 48 px and up. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D3E4B"/>
      <stop offset=".55" stop-color="#10232B"/>
      <stop offset="1" stop-color="#09141A"/>
    </linearGradient>
    <radialGradient id="glow" cx="128" cy="128" r="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#39C2C9" stop-opacity=".28"/>
      <stop offset="1" stop-color="#39C2C9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="real" x1="0" y1="62" x2="0" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#74E8EA"/>
      <stop offset="1" stop-color="#1A97A3"/>
    </linearGradient>
    <linearGradient id="mirror" x1="128" y1="0" x2="206" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E3FAFA" stop-opacity=".8"/>
      <stop offset="1" stop-color="#7BD9DC" stop-opacity=".24"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="206" x2="0" y2="228" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2FB9C2" stop-opacity=".42"/>
      <stop offset="1" stop-color="#2FB9C2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="horizon" x1="44" y1="0" x2="212" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9FE6E8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#9FE6E8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#9FE6E8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="seam" x1="0" y1="40" x2="0" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <path id="m" d="M54 196V62h38l36 58 36-58h38v134h-36v-72l-30 46h-16l-30-46v72Z"/>
    <clipPath id="left"><rect width="128" height="256"/></clipPath>
    <clipPath id="right"><rect x="128" width="128" height="256"/></clipPath>
    <clipPath id="below"><rect x="8" y="206" width="240" height="24"/></clipPath>
    <clipPath id="m-left"><path d="M54 196V62h38l36 58v52h-8l-30-46v70Z"/></clipPath>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="55.25" fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="1.5"/>
  <circle cx="128" cy="128" r="104" fill="url(#glow)"/>
  <use href="#m" transform="translate(0 402) scale(1 -1)" fill="url(#floor)" clip-path="url(#below)"/>
  <path d="M44 203.5h168" stroke="url(#horizon)" stroke-width="1.5"/>
  <g clip-path="url(#left)">
    <use href="#m" fill="url(#real)" stroke="url(#real)" stroke-width="10" stroke-linejoin="round"/>
  </g>
  <path d="M40 132 128 70v26L40 158Z" fill="#fff" opacity=".3" clip-path="url(#m-left)"/>
  <g clip-path="url(#right)">
    <use href="#m" fill="url(#mirror)" stroke="#BFF1F2" stroke-opacity=".55" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <path d="M128 40v168" stroke="url(#seam)" stroke-width="3" stroke-linecap="round"/>
</svg>

name: Motor proprio Electron
on:
  push:
    paths: ["native/**", ".github/workflows/native-tests.yml"]
  pull_request:
    paths: ["native/**", ".github/workflows/native-tests.yml"]
jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: native/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:android
      - run: npm run build
      - name: Android SDK packages
        shell: pwsh
        run: sdkmanager "platforms;android-35" "build-tools;36.0.0" "platform-tools"
      - run: npm run android
